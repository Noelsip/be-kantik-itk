# Vhost Kantin ITK API pada api-kantinitk.noelsipayung.me.
# Dipasang pada nginx terdepan yang memegang porta 80 dan 443.
# Dokumentasi Scalar disajikan aplikasi pada /docs-api, sehingga tidak
# memerlukan location tersendiri di sini.

server {
    listen 80;
    server_name api-kantinitk.noelsipayung.me;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api-kantinitk.noelsipayung.me$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-kantinitk.noelsipayung.me;

    ssl_certificate     /etc/letsencrypt/live/api-kantinitk.noelsipayung.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-kantinitk.noelsipayung.me/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Diberi kelonggaran di atas batas 5 MB milik aplikasi, agar berkas yang
    # melebihi batas ditolak aplikasi dengan pesan yang jelas, bukan oleh nginx.
    client_max_body_size 6m;

    # Penyelesaian nama memakai DNS internal Docker dan sengaja ditunda sampai
    # permintaan masuk. Dengan begitu nginx tetap dapat dimuat ketika container
    # api sedang mati, dan domain membalas 502 alih-alih seluruh nginx gagal.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kantin_api kantin-itk-api;

    location / {
        proxy_pass http://$kantin_api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
